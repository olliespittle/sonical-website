[build]
  command = "astro build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The old CosmOS site had a "Products — Coming Soon" page that Google still has
# a sitelink for. /products has been a 404 since the redesign, which is how a
# partner prospect bounced in June 2026. Send it to the homepage, whose Momentum
# section carries the short Remora line and the remora.pro link.
# Remove this if /products is ever published as a real page.
[[redirects]]
  from = "/products"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/products/*"
  to = "/"
  status = 301
  force = true

# Legacy URLs from the old CosmOS site. Search Console was still reporting all
# three as 404s in September 2026, so the crawl budget and any remaining link
# equity were going nowhere. Each one points at whatever replaced it.
#
#   /partnergallery  was the partner logo wall      -> /partners/
#   /blog            was the news index             -> /newsroom/
#   /headphone3p0    was the Headphone 3.0 explainer -> homepage (the Solution
#                    card carries the 1.0 -> 2.0 -> 3.0 arc)
#   /contactus       was the contact page           -> /#contact
#
# Both the bare path and the wildcard are listed because Google has crawled
# sub-paths of two of them (/partnergallery/1, /blog/all/1).
#
# /contactus was added 2026-09-06. It was not in the Search Console report,
# but Google's link graph still knows it (it showed up as a referring page
# while inspecting /privacy-policy), and the contact form is the site's main
# conversion point, so an old bookmark landing on a 404 is the worst case
# here. The #contact fragment is picked up by the homepage's load-time
# deep-link handler, which scrolls to the form.
#
# Still 404, deliberately left alone (Ollie, 2026-09-06): /aboutus, /news,
# /technology, /cosmos, /developers. None are in the report and none have a
# clean destination. Revisit only if one starts showing up.
[[redirects]]
  from = "/partnergallery"
  to = "/partners/"
  status = 301
  force = true

[[redirects]]
  from = "/partnergallery/*"
  to = "/partners/"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/newsroom/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/newsroom/"
  status = 301
  force = true

[[redirects]]
  from = "/headphone3p0"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/headphone3p0/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contactus"
  to = "/#contact"
  status = 301
  force = true

[[redirects]]
  from = "/contactus/*"
  to = "/#contact"
  status = 301
  force = true

# /intro is the unlisted company intro video, shared by direct link only. The
# noindex meta on the page is the primary signal; this header covers the case
# where a crawler sees the URL without rendering the page. Deliberately NOT a
# robots.txt Disallow, which would stop crawlers reading the noindex at all.
[[headers]]
  for = "/intro"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/intro/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# /plugin-demo is the unlisted Remora plugin-download demo video, same
# unlisted-by-link treatment as /intro above.
[[headers]]
  for = "/plugin-demo"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/plugin-demo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
